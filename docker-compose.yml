services:
  indoor_db:
    image: postgis/postgis:16-3.4-alpine
    container_name: indoor_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prefeitura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefeitura_secret}
      POSTGRES_DB: ${POSTGRES_DB:-prefeitura_indoor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prefeitura} -d ${POSTGRES_DB:-prefeitura_indoor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  indoor_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indoor_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prefeitura}:${POSTGRES_PASSWORD:-prefeitura_secret}@indoor_db:5432/${POSTGRES_DB:-prefeitura_indoor}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data/geojson:/data/geojson:ro
      - ./indoor:/indoor:ro
    depends_on:
      indoor_db:
        condition: service_healthy

  indoor_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indoor_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/geojson:/data/geojson:ro
      - ./indoor:/indoor:ro

  indoor_nginx:
    image: nginx:1.27-alpine
    container_name: indoor_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - indoor_frontend
      - indoor_api

volumes:
  postgres_data:
